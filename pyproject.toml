[project]
name = "kinomanyak"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai==3.41.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
